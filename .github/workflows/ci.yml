name: Backend CI

on:
  push:
    branches:
      - feature/product-source-dropdown-mail-security-20261112
  pull_request:
    branches:
      - integration/sylva-stabilization-20261112

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        run: npm test
