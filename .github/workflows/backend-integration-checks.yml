name: Backend integration checks

permissions:
  contents: write

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix
      - name: Verify clean lockfile installation
        run: npm ci
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -not -name 'old-*' -print0)

      - name: Load Express application and registered routers
        run: node -e "require('./app'); console.log('Express application loaded successfully')"

      - name: Run backend unit tests
        run: npm test

      - name: Report production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('Production dependency vulnerabilities:', JSON.stringify(r.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(r.vulnerabilities || {})) console.log(name + ': ' + item.severity + ', direct=' + item.isDirect + ', range=' + item.range + ', fix=' + JSON.stringify(item.fixAvailable));"

      - name: Commit compatible security lockfile updates
        if: github.ref == 'refs/heads/integration/sylva-stabilization-20261112'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: apply compatible dependency security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
